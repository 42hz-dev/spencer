name: spencer

services:
  nginx:
    image: nginx:stable-alpine
    ports:
      - "8080:80"
    volumes:
      - ./public:/var/www/spencer/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  php:
    build: ./docker/php
    # nginx와 같은 절대경로여야 SCRIPT_FILENAME을 php-fpm이 찾을 수 있음
    volumes:
      - ./:/var/www/spencer:ro
