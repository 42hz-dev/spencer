server {
    listen 80;
    server_name _;                              # 실서버: 도메인으로 변경

    root /var/www/spencer/public;
    index index.php;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /index.php {
        fastcgi_pass php:9000;                  # 실서버: unix:/run/php/php8.3-fpm.sock
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # index.php 외의 PHP 실행 차단
    location ~ \.php$ {
        return 404;
    }

    location /images/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location ~ /\. {
        return 404;
    }
}
